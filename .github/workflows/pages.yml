name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fearngreed-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --locked
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - name: Verify checkout public contract
        id: contract
        shell: bash
        run: |
          uv run --frozen python -m fearngreed.verify
          data_as_of="$(jq -er '.dataAsOf' data/summary.json)"
          source_freshness_passed="$(jq -r '.status.sourceFreshnessPassed | tostring' data/summary.json)"
          [[ "$source_freshness_passed" == "true" || "$source_freshness_passed" == "false" ]]
          expected_data_as_of=""
          if [[ "$source_freshness_passed" == "true" ]]; then
            expected_data_as_of="$(jq -er '.status.expectedDataAsOf' data/summary.json)"
            [[ "$data_as_of" == "$expected_data_as_of" ]]
          fi
          echo "data_as_of=$data_as_of" >> "$GITHUB_OUTPUT"
          echo "expected_data_as_of=$expected_data_as_of" >> "$GITHUB_OUTPUT"
      - run: uv run --frozen ruff format --check .
      - run: npm test
      - run: uv run --frozen python -m fearngreed.site --output dist
      - run: uv run --frozen python -c "from pathlib import Path; from fearngreed.security import scan_public_files; assert not scan_public_files(Path('.'))"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify exact live public bytes and freshness
        shell: bash
        env:
          EXPECTED_DATA_AS_OF: ${{ steps.contract.outputs.expected_data_as_of }}
        run: |
          verify_args=(--base-url "${{ steps.deployment.outputs.page_url }}")
          if [[ -n "$EXPECTED_DATA_AS_OF" ]]; then
            verify_args+=(--expected-data-as-of "$EXPECTED_DATA_AS_OF")
          fi
          for attempt in {1..30}; do
            if uv run --frozen python -m fearngreed.verify "${verify_args[@]}"; then
              exit 0
            fi
            if [[ $attempt -eq 30 ]]; then
              exit 1
            fi
            sleep 10
          done
