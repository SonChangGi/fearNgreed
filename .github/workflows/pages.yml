name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fearngreed-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: uv sync --locked
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -m fearngreed.verify
      - run: uv run --frozen ruff format --check .
      - run: npm test
      - run: uv run --frozen python -m fearngreed.site --output dist
      - run: uv run --frozen python -c "from pathlib import Path; from fearngreed.security import scan_public_files; assert not scan_public_files(Path('.'))"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public derivative hashes
        shell: bash
        run: |
          for attempt in {1..12}; do
            if uv run --frozen python -m fearngreed.verify --base-url "${{ steps.deployment.outputs.page_url }}"; then
              exit 0
            fi
            if [[ $attempt -eq 12 ]]; then
              exit 1
            fi
            sleep 5
          done

  public-site-health:
    needs: deploy
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Fail only when the existing Fear and Greed page is unusable
        env:
          PAGE_URL: https://sonchanggi.github.io/fearNgreed/
        shell: bash
        run: |
          set -u
          required_paths=(index.html data/summary.json data/dashboard.json)
          for attempt in {1..12}; do
            usable=true
            for relative_path in "${required_paths[@]}"; do
              readback="$RUNNER_TEMP/fearngreed-pages-health-${relative_path//\//-}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                usable=false
                break
              fi
              if [[ ! -s "$readback" ]]; then
                usable=false
                break
              fi
              if [[ "$relative_path" == "index.html" ]] && ! grep -Eiq '<!doctype html|<html' "$readback"; then
                usable=false
                break
              fi
              if [[ "$relative_path" == *.json ]] && ! jq -e 'type == "object" and length > 0' "$readback" >/dev/null; then
                usable=false
                break
              fi
            done
            if [[ "$usable" == "true" ]]; then
              echo "The existing Fear and Greed page remains usable; automatic deploy errors stay in run logs without failure mail."
              exit 0
            fi
            [[ $attempt -lt 12 ]] && sleep 10
          done
          echo "::error::The public Fear and Greed page or its required JSON is unavailable or invalid."
          exit 1
